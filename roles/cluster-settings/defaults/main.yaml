elasticsearch:
  clusterSettings:
    # Default: 95%
    cluster.routing.allocation.disk.watermark.flood_stage.frozen: "99.99%"
    # Default: 95%
    cluster.routing.allocation.disk.watermark.flood_stage: "99.99%"
    # Default: 90%
    cluster.routing.allocation.disk.watermark.high: "99.98%"
    # Default: 85%
    cluster.routing.allocation.disk.watermark.low: "99.97%"
    search.default_search_timeout: "15s"