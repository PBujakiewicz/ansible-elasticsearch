---
- name: "SETUP: Difference / Intersect Resources"
  set_fact:
    resources_to_create: "{{ resources_names | difference(fetched_resources_names) | list | sort }}"
    resources_to_update: "{{ resources_names | intersect(fetched_resources_names) | list | sort}}"
    resources_to_delete: "{{ fetched_resources_names | difference(resources_names) | list | sort}}"

- name: "SETUP: Resources to Create"
  debug:
    msg: "{{ resources_to_create }}"

- name: "SETUP: Resources to Update"
  debug:
    msg: "{{ resources_to_update }}"

- name: "SETUP: Resources to Delete"
  debug:
    msg: "{{ resources_to_delete }}"