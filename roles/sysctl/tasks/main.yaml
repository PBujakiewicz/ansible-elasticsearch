---
- name: "Managed sysctl Params - defaults"
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: "{{ item.state | default('present') }}"
    sysctl_set: yes
    reload: yes
  with_items:
    - "{{ sysctl | default([]) }}"

- name: "Managed sysctl Params - custom"
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: "{{ item.state | default('present') }}"
    sysctl_set: yes
    reload: yes
  with_items:
    - "{{ sysctl_custom | default([]) }}"
