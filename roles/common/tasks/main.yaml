---
- name: "Manage Bind Utils Installation"
  yum:
    name: bind-utils
    state: "{{ 'present' if common.packages.tools.bind_utils | default(true) else 'absent' }}"

- name: "Manage Net Tools Installation"
  yum:
    name: net-tools
    state: "{{ 'present' if common.packages.tools.net_tools | default(true) else 'absent' }}"

- name: "Manage Additional Packages Installation"
  yum:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
  when:
    - item.name is defined
    - item.state is defined
  with_items: "{{ common.packages.additional }}"

- name: Import GPG keys for enabled repositories
  rpm_key:
    state: present
    key: "{{ item.value.config.gpgkey }}"
  loop: "{{ common.repositories | dict2items }}"
  when: item.value.enabled

- name: Generate repositories from common.repositories
  template:
    src: repository.j2
    dest: "/etc/yum.repos.d/{{ item.key | replace('_', '-') }}.repo"
  loop: "{{ common.repositories | dict2items }}"
  when: item.value.enabled
